[project]
name = "production-rag"
version = "0.1.0"
description = "HR Policy RAG Assistant — LangChain + Groq + Qdrant + Jina Embeddings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv",
    "langchain==1.4.0",
    "langchain-community",
    "langchain-core",
    "langchain-groq",
    "langchain-text-splitters",
    "jinaai",
    "streamlit",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
